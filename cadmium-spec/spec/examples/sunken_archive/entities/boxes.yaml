sealed_iron_box_book:
  kind: fixture
  label: sealed iron box
  tags: [iron, sealed]
  obstructs: [movement]
  verbs:
    open:
      requirement: { all: [ { has_item: coast:prybar }, { has_item: coast:cold_chisel } ] }
      effects:
        - give_item: { target: actor, ref: book_of_weeping }
        - despawn: { target: target }
