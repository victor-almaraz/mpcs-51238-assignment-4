id: sozon
name: Sozon Hesychios
template: coast:commoner
disposition: neutral
topics:
  path:
    label: the cliff path
    brief: Sozon answers with a question. Where does a path go, he asks, when you stop walking it?
  seeing:
    label: the Church's doctrine
    brief: >-
      Sozon was a reader of the Chapter. The world, he says, is a made thing and flawed, and a spark
      of the true light hides in every person. To see it is to be illuminated. Did you think the
      Chapter would let you see it cheaply?
  stillness:
    label: why he left the Chapter
    brief: Why would a reader leave a library, he asks, except to read something that was not written down?
  walk:
    label: the old walk
    brief: >-
      Have you walked the labyrinth above the town, he asks? Its builders came before the clergy, and
      who were they? A bronze disc lies at its center, and would the professor not pay to see it?
  schools:
    label: the two schools of seeing
    brief: >-
      Is seeing a vision or a measure? Sozon, Sister Agne, and the First Reader turn inward, to the
      dark and the three-faced head. Professor Orsolakis and Maestro Kleon turn outward, to lenses
      and tide tables. The tide-readers do both. Did you think one Chapter could hold both for long?
