id: vantane
name: Oriel Vantane
template: coast:commoner
disposition: wary
topics:
  halls:
    label: the halls of Perpetua
    brief: >-
      Oriel Vantane names the ship's halls as a country. The Long Gallery, the Bright Stacks, the
      Orlop of Iron Boxes, the Ward. She has been locked in the registry vault for six weeks, two days
      past her last ration, and she counts the halls to keep her mind.
  rising:
    label: how Perpetua sank
    brief: >-
      She saw the dead rise from the sea, sailors with no eyes painted on their lids. They climbed the
      sides of the ship and tore at the hatches until the holds flooded, and she locked herself in the
      vault, which opens only from outside.
  boxes:
    label: the iron boxes
    brief: >-
      The boxes are hard to open and hard to move. Custodians believe that iron holds an artifact's
      influence in. Opening one is bringing it to light, she says, and it takes a prybar and a cold
      chisel together.
  ration:
    label: a ship's biscuit from your pack
    when: { has_item: coast:ration }
    brief: >-
      Vantane takes the biscuit in both hands and eats it slowly, crumb by crumb, as if it might be
      the last. When she looks up she has stopped counting the halls, and she talks to you the way
      she once talked to her crew.
    effects:
      - remove_item: { target: actor, ref: coast:ration }
      - set_flag: { flag: keeper_fed, value: true }
  ring:
    label: the ring in the open box
    when: { any: [ { flag: clues, gte: 2 }, { flag: keeper_fed } ] }
    brief: She calls the ring in the ward chamber a false seal, and asks what you have heard of it.
    effects:
      - set_flag: { flag: ward_known, value: true }
      - reveal: { secret: vantane.forgery }
  plan:
    label: why Perpetua sank where she did
    when: { any: [ { flag: clues, gte: 3 }, { flag: keeper_fed } ] }
    brief: She has studied the registry drawings for weeks and asks you what the chart and the ledger said.
    effects:
      - reveal: { secret: vantane.plan }
  visitor:
    label: who opened the box
    when: { all: [ { flag: ward_known }, { flag: clues, gte: 4 } ] }
    brief: She is quiet for a long time, and then she tells you about the last visitor before the voyage.
    effects:
      - reveal: { secret: vantane.visitor }
  seal:
    label: sealing the archive
    when: { flag: ward_sealed }
    brief: >-
      With the false seal shut in iron, Vantane agrees to leave the vault. She asks you to close the
      iron doors behind you and flood the lower stacks, so the archive stays beneath the water.
  reliquary:
    label: the Royal Reliquary
    brief: >-
      Vantane is a custodian. Above her are registrars, who keep the registry in Verrane, and the Lord
      Custodian, Hartwig Alder; below her, the couriers in grey. Perpetua sank six weeks ago, she
      says, and the registry will not yet have noticed.
secrets:
  forgery: >-
    The ring is a recent forgery. Its three faces follow the Reliquary's registry drawing of the head,
    not the Chapter's liturgical order, so whoever forged it had the registry open in front of them. It
    commands the dead who died unseen.
  plan: >-
    The ship was sunk on purpose, in shallows chosen so the cargo could be raised later. A recovery
    charter existed before the sinking.
  visitor: >-
    Before the voyage a visitor in Reliquary grey came aboard carrying a Concord charter case, and gave
    no name. One person held both a Reliquary commission and a Concord charter.
