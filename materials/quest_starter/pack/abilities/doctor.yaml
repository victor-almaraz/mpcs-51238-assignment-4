# The Doctor's quick start (Quest Creators Resource, chapter 3). Name and learning path
# from the Creators Resource, short description in ../../descriptions.yaml; costs are its lowest listed activation cost.

mend:
  label: Mend
  target: entity
  system_stats: {"roles": ["doctor"], "path": "healing", "cost": {"ap": 1}}
  effects:
    - {"heal": {"target": "target", "amount": 2}}
sleep:
  label: Sleep
  target: entity
  system_stats: {"roles": ["doctor"], "path": "alteration", "cost": {"ap": 2}}
  effects:
    - {"apply_condition": {"target": "target", "condition": "asleep"}}
deathsense:
  label: Deathsense
  target: self
  system_stats: {"roles": ["doctor"], "path": "necromancy", "cost": {"ap": 0}}
  effects: []
corrupt:
  label: Corrupt
  target: entity
  system_stats: {"roles": ["doctor"], "path": "harm", "cost": {"ap": 0}, "roll": true}
  effects:
    - {"damage": {"target": "target", "amount": 2, "type": "magic"}}
modulate:
  label: Modulate
  target: entity
  system_stats: {"roles": ["doctor"], "path": "perception", "cost": {"ap": 1}}
  effects: []
examine_the_dead:
  label: Examine the Dead
  target: entity
  system_stats: {"roles": ["doctor"], "path": "examination", "cost": {"ap": 1}}
  effects: []
