# The Invoker's quick start (Quest Creators Resource, chapter 3). Name and learning path
# from the Creators Resource, short description in ../../descriptions.yaml; costs are its lowest listed activation cost.

declare:
  label: Declare
  target: self
  system_stats: {"roles": ["invoker"], "path": "invocation", "cost": {"ap": 0}}
  effects: []
petition:
  label: Petition
  target: self
  system_stats: {"roles": ["invoker"], "path": "invocation", "cost": {"ap": 2}}
  effects: []
soul_gaze:
  label: Soul Gaze
  target: entity
  system_stats: {"roles": ["invoker"], "path": "inquiries", "cost": {"ap": 1}}
  effects: []
fiery_avenger:
  label: Fiery Avenger
  target: self
  system_stats: {"roles": ["invoker"], "path": "wrath", "cost": {"ap": 1}}
  effects: []
thunderous_word:
  label: Thunderous Word
  target: entity
  system_stats: {"roles": ["invoker"], "path": "wrath", "cost": {"ap": 2}, "roll": true}
  effects:
    - {"damage": {"target": "target", "amount": 2, "type": "magic"}}
shield:
  label: Shield
  target: self
  system_stats: {"roles": ["invoker"], "path": "wards", "cost": {"ap": 1}}
  effects: []
