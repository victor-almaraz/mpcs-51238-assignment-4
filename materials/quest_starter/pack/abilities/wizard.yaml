# The Wizard's quick start (Quest Creators Resource, chapter 3). Name and learning path
# from the Creators Resource, short description in ../../descriptions.yaml; costs are its lowest listed activation cost.

magic_strike:
  label: Magic Strike
  target: entity
  system_stats: {"roles": ["wizard"], "path": "evocation", "cost": {"ap": 0}, "roll": true}
  effects:
    - {"damage": {"target": "target", "amount": 2, "type": "magic"}}
blink:
  label: Blink
  target: self
  system_stats: {"roles": ["wizard"], "path": "planeshifting", "cost": {"ap": 1}}
  effects: []
sense_magic:
  label: Sense Magic
  target: self
  system_stats: {"roles": ["wizard"], "path": "projection", "cost": {"ap": 0}}
  effects: []
speak:
  label: Speak
  target: entity
  system_stats: {"roles": ["wizard"], "path": "trickery", "cost": {"ap": 1}}
  effects: []
pinch:
  label: Pinch
  target: self
  system_stats: {"roles": ["wizard"], "path": "trickery", "cost": {"ap": 2}}
  effects: []
familiar:
  label: Familiar
  target: self
  system_stats: {"roles": ["wizard"], "path": "conjuration", "cost": {"ap": 2}}
  effects: []
